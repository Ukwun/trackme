[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[context.production.environment]
  NODE_ENV = "production"
  # Required in Netlify environment settings:
  # JWT_SECRET = "..."
  # MONGODB_URI = "..."
  # NEXT_PUBLIC_MAPBOX_TOKEN = "..."
  # SENTRY_DSN = "..."
  # NEXT_PUBLIC_SENTRY_DSN = "..."
