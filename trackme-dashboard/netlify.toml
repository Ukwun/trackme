[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  # Tailwind/PostCSS and TypeScript are required during the production build.
  NPM_FLAGS = "--include=dev"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Required in Netlify environment settings:
# JWT_SECRET, MONGODB_URI, NEXT_PUBLIC_MAPBOX_TOKEN,
# AUTH_ALLOW_LOCAL_FALLBACK should remain false in production.
