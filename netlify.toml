[build]
  base = "trackme-dashboard"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  NPM_FLAGS = "--include=dev"
  MONGODB_FAMILY = "4"
  MONGODB_SERVER_SELECTION_TIMEOUT_MS = "15000"
  MONGODB_TLS = "true"
  MONGODB_DB_NAME = "trackme"
  AUTH_ALLOW_LOCAL_FALLBACK = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"
